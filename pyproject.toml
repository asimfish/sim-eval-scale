[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-eval-scale"
version = "0.1.0"
description = "Evidence-gated topology sweeps for simulator evaluation and data collection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Sim Eval Scale contributors"}]
keywords = ["simulation", "isaaclab", "benchmark", "evaluation", "robotics"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]
dependencies = []

[project.scripts]
sim-eval-scale = "sim_eval_scale.cli:main"

[project.urls]
Repository = "https://github.com/asimfish/sim-eval-scale"
Issues = "https://github.com/asimfish/sim-eval-scale/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff==0.17.3"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
